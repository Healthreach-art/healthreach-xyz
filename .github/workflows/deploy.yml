name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: true

      - name: Build application
        run: npm run build

      - name: Verify generated Worker config and R2 binding
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const config = JSON.parse(
            readFileSync(".output/server/wrangler.json", "utf8"),
          );
          const documentsBucket = config.r2_buckets?.find(
            (bucket) => bucket.binding === "DOCUMENTS_BUCKET",
          );

          if (config.name !== "healthreachcare") {
            throw new Error("Generated Worker config has an unexpected name.");
          }
          if (documentsBucket?.bucket_name !== "healthreachcare-documents") {
            throw new Error("Generated Worker config is missing the expected R2 binding.");
          }
          NODE

      - name: Dry-run Worker deployment
        run: npx wrangler deploy --config .output/server/wrangler.json --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy --config .output/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
